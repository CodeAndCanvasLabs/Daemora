# apps/api — Fly.io config.
#
# Deploy from repo root:  flyctl deploy --config apps/api/fly.toml --dockerfile apps/api/Dockerfile
# Or via GitHub Actions (see .github/workflows/fly-deploy.yml — runs on push to main).
#
# Set secrets BEFORE first deploy:
#   flyctl secrets set \
#     DATABASE_URL="..." \
#     JWT_SIGNING_KEY="..." \
#     SESSION_COOKIE_SECRET="..." \
#     MASTER_KEK="..." \
#     CONTROL_PLANE_ADMIN_TOKEN="..." \
#     RESEND_API_KEY="..." \
#     CONTRA_PAYMENT_LINK_PRO="..."

app = "daemora-api"
primary_region = "iad"

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  NODE_ENV          = "production"
  LOG_LEVEL         = "info"
  PORT              = "8090"
  PUBLIC_APP_URL    = "https://daemora.com"
  PUBLIC_API_URL    = "https://daemora-api.fly.dev"
  RESEND_FROM_EMAIL = "no-reply@daemora.com"
  TENANT_HOST_SUFFIX = ".daemora.app"
  # CONTROL_PLANE_INTERNAL_URL gets set once the control plane app is deployed.
  CONTROL_PLANE_INTERNAL_URL = "http://daemora-control-plane.flycast:8080"

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines  = "stop"     # idle? save money
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval     = "30s"
    timeout      = "5s"
    grace_period = "15s"
    method       = "GET"
    path         = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "512mb"

[deploy]
  strategy = "rolling"
