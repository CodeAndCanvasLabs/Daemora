# Fly.io config for apps/api — matches the app you created in the Fly UI:
#   https://fly.io/apps/deamora-specialized-saas
#
# Deploy:   flyctl deploy
# Secrets:  see apps/api/.env.example for the required keys, then
#           flyctl secrets set DATABASE_URL=... JWT_SIGNING_KEY=... (etc)

app = "deamora-specialized-saas"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV          = "production"
  LOG_LEVEL         = "info"
  PORT              = "8090"
  PUBLIC_APP_URL    = "https://daemora.com"
  PUBLIC_API_URL    = "https://deamora-specialized-saas.fly.dev"
  RESEND_FROM_EMAIL = "no-reply@daemora.com"
  TENANT_HOST_SUFFIX = ".daemora.app"
  # Control plane URL — replace once the control-plane Fly app exists.
  CONTROL_PLANE_INTERNAL_URL = "http://daemora-control-plane.flycast:8080"

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval     = "30s"
    timeout      = "5s"
    grace_period = "20s"
    method       = "GET"
    path         = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "512mb"

[deploy]
  strategy = "rolling"
