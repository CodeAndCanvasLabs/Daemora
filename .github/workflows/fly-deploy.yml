# Deploy apps/api to Fly.io on push to main.
#
# Required GitHub repo secrets:
#   FLY_API_TOKEN  — generate via:  flyctl auth token
#
# Prerequisites (one-time, do these BEFORE the first push):
#   1. flyctl auth login
#   2. flyctl apps create daemora-api --org <your-fly-org>
#   3. flyctl secrets set --app daemora-api DATABASE_URL=... JWT_SIGNING_KEY=... (etc — see apps/api/.env.example)
#   4. In GitHub repo settings → Secrets → Actions → add FLY_API_TOKEN

name: fly-deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/fly-deploy.yml"
  workflow_dispatch:

concurrency:
  group: fly-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy apps/api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --config apps/api/fly.toml --dockerfile apps/api/Dockerfile --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
