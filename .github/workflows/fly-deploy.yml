# Deploy apps/api to Fly.io on push to main.
#
# Required GitHub repo secrets:
#   FLY_API_TOKEN  — generate via:  flyctl auth token
#
# Prerequisites (one-time, do these BEFORE the first push):
#   1. flyctl auth login
#   2. App must exist on Fly: deamora-specialized-saas (already created via UI)
#   3. flyctl secrets set --app deamora-specialized-saas \
#        DATABASE_URL=... JWT_SIGNING_KEY=... SESSION_COOKIE_SECRET=... \
#        MASTER_KEK=... CONTROL_PLANE_ADMIN_TOKEN=... RESEND_API_KEY=...
#      (see apps/api/.env.example for the full list)
#   4. GitHub repo settings → Secrets → Actions → add FLY_API_TOKEN
#
# Depends on the `ci` workflow passing first (tests + docker-build) so we
# never deploy a broken Dockerfile.

name: fly-deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "src/**"
      - "Dockerfile"
      - "fly.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/fly-deploy.yml"
  workflow_dispatch:

concurrency:
  group: fly-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy apps/api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        # Reads fly.toml + Dockerfile from repo root. --remote-only uses
        # Fly's Depot builder so the runner doesn't have to install Docker.
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
