# Deploy apps/api to Fly.io — MANUAL ONLY.
#
# Run from:
#   1. GitHub UI:  Actions tab → "fly-deploy" → "Run workflow" → main
#   2. CLI:        gh workflow run fly-deploy.yml --ref main
#
# We do NOT auto-deploy on push. Every prod release is a human decision —
# this prevents a bad commit on main from rolling out before you've verified
# it locally.
#
# Required GitHub repo secrets:
#   FLY_API_TOKEN  — generate locally with:  flyctl auth token
#                     then add at: GitHub repo → Settings → Secrets and
#                     variables → Actions → New repository secret
#
# Prerequisites (one-time):
#   1. flyctl auth login   (already done — you have flyctl set up)
#   2. App "deamora-specialized-saas" exists on Fly (already created via UI)
#   3. flyctl secrets set --app deamora-specialized-saas \
#        DATABASE_URL=... JWT_SIGNING_KEY=... SESSION_COOKIE_SECRET=... \
#        MASTER_KEK=... CONTROL_PLANE_ADMIN_TOKEN=... RESEND_API_KEY=... \
#        CONTRA_PAYMENT_LINK_PRO=...
#      (already done — see Fly UI → Secrets)
#   4. FLY_API_TOKEN added to GitHub repo secrets — DO THIS NEXT

name: fly-deploy

on:
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy apps/api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        # Reads fly.toml + Dockerfile from repo root. --remote-only uses
        # Fly's Depot builder so the runner doesn't have to install Docker.
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
